name: Build and Release

on:
  push:
    tags:
      - 'v*' # Dispara quando você cria uma tag como v0.5.0
  workflow_dispatch: # Permite rodar manualmente pela aba Actions

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MinGW (Manual via Chocolatey)
        shell: pwsh
        run: |
          choco install mingw --version 15.2.0 -y
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CMake
        # Forçamos o gerador MinGW para bater com seu CMakeLists.txt que exige gcc/g++
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: |
          cmake --build build --config Release

      - name: Prepare Artifacts
        # Organiza apenas o executável e a pasta de recursos para o ZIP
        run: |
          mkdir release_pkg
          cp bin/R2NESV2.exe release_pkg/
          cp -r bin/resources release_pkg/
          
      - name: Create Zip
        shell: pwsh
        run: |
          Compress-Archive -Path release_pkg/* -DestinationPath R2NES_Windows_x64.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: R2NES_Windows_x64.zip
          body: |
            Build automática gerada pelo GitHub Actions.
            
            **Mudanças nesta versão:**
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    needs: build-windows
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libpulse-dev libasound2-dev \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxfixes-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles-dev libdrm-dev libgbm-dev

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release --parallel

      - name: Prepare Linux package
        run: tar -czf R2NES_Linux_x64.tar.gz -C bin R2NESV2 resources

      - name: Upload artifact (execução manual)
        uses: actions/upload-artifact@v4
        with:
          name: R2NES_Linux_x64
          path: R2NES_Linux_x64.tar.gz

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: R2NES_Linux_x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}