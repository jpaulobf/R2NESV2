name: Build and Release

on:
  push:
    tags:
      - 'v*' # Dispara quando você cria uma tag como v0.5.0
  workflow_dispatch: # Permite rodar manualmente pela aba Actions

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MinGW (Manual via Chocolatey)
        shell: pwsh
        run: |
          choco install mingw --version 15.2.0 -y
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CMake
        # Forçamos o gerador MinGW para bater com seu CMakeLists.txt que exige gcc/g++
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: |
          cmake --build build --config Release

      - name: Prepare Artifacts
        # Inclui o runtime MinGW necessário para executar o binário em Windows limpo
        shell: pwsh
        run: |
          $packageDir = "release_pkg"
          $cxxPath = (Get-Command g++ -CommandType Application -ErrorAction Stop).Source
          New-Item -ItemType Directory -Path $packageDir | Out-Null
          Copy-Item -Path "bin/R2NESV2.exe" -Destination $packageDir
          Copy-Item -Path "bin/resources" -Destination $packageDir -Recurse

          $runtimeDlls = @(
            "libgcc_s_seh-1.dll",
            "libstdc++-6.dll",
            "libwinpthread-1.dll"
          )

          foreach ($runtimeDll in $runtimeDlls) {
            $runtimePath = (& $cxxPath "-print-file-name=$runtimeDll" | Select-Object -First 1).Trim()
            if ($runtimePath -eq $runtimeDll -or -not (Test-Path -LiteralPath $runtimePath -PathType Leaf)) {
              throw "O MinGW em '$cxxPath' não localizou a DLL '$runtimeDll' (retorno: '$runtimePath')."
            }

            Copy-Item -LiteralPath $runtimePath -Destination $packageDir
          }
          
      - name: Create Zip
        shell: pwsh
        run: |
          Compress-Archive -Path release_pkg/* -DestinationPath R2NES_Windows_x64.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: R2NES_Windows_x64.zip
          body: |
            Build automática gerada pelo GitHub Actions.
            
            **Mudanças nesta versão:**
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    needs: build-windows
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libpulse-dev libasound2-dev \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxfixes-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles-dev libdrm-dev libgbm-dev

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release --parallel

      - name: Prepare Linux package
        run: tar -czf R2NES_Linux_x64.tar.gz -C bin R2NESV2 resources

      - name: Upload artifact (execução manual)
        uses: actions/upload-artifact@v4
        with:
          name: R2NES_Linux_x64
          path: R2NES_Linux_x64.tar.gz

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: R2NES_Linux_x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
